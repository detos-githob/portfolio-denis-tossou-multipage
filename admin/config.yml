# ============================================================================
# Configuration Decap CMS — panneau d'administration du portfolio
#
# ⚠️ NE PAS ÉCRASER ce fichier avec une version modèle : sans les vraies
#    valeurs de "repo" et "base_url" ci-dessous, la connexion /admin casse.
# ============================================================================

backend:
  name: github
  repo: detos-githob/portfolio-denis-tossou-multipage
  branch: main
  base_url: https://decap-oauth-tossou.jerbtos.workers.dev
  auth_endpoint: auth

# Là où les images ajoutées depuis le CMS seront rangées
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

# Affiche un bouton "Voir le site" et "Aperçu" dans l'interface
site_url: https://denistossou.com
display_url: https://denistossou.com

collections:
  - name: "projects"
    label: "Projets"
    files:
      - file: "data/projects.json"
        label: "Liste des projets"
        name: "projects"
        fields:
          - label: "Projets"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Titre du projet", name: "title", widget: "string" }
              - label: "Domaine"
                name: "category"
                widget: "select"
                options:
                  - { label: "Développement", value: "developpement" }
                  - { label: "Design", value: "design" }
                  - { label: "Marketing digital", value: "marketing" }
              - label: "Statut"
                name: "status"
                widget: "select"
                options:
                  - { label: "Terminé", value: "termine" }
                  - { label: "En cours", value: "encours" }
                default: "termine"
              - label: "Image de la fiche"
                name: "image"
                widget: "image"
                hint: "Photo du projet, ou logo si c'est une fiche d'identité visuelle. Format WebP ou JPG de moins de 300 Ko, 1600 px de large maximum, nom de fichier sans accent ni espace."
              - label: "Type d'image"
                name: "imageStyle"
                widget: "select"
                options:
                  - { label: "Photo / capture d'écran (remplit le cadre)", value: "cover" }
                  - { label: "Logo (centré sur fond blanc)", value: "contain" }
                default: "cover"
              - label: "Badge affiché sur la vignette"
                name: "badge"
                widget: "string"
                required: false
                hint: "Court texte affiché en haut de l'image, ex. le nom du client."
              - label: "Résumé"
                name: "summary"
                widget: "text"
              - label: "Lien vers le projet (optionnel)"
                name: "link"
                widget: "string"
                required: false
                hint: "Laisse vide si le projet n'a pas de lien public. Affiche un bouton « Voir le projet »."
              - label: "Points clés (optionnel)"
                name: "features"
                widget: "list"
                required: false
                field: { label: "Point", name: "item", widget: "string" }
                hint: "Utilisé surtout pour les fiches Marketing digital (ex. community management)."

  - name: "blog"
    label: "Blog"
    files:
      - file: "data/blog.json"
        label: "Articles du blog"
        name: "blog"
        fields:
          - label: "Articles"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{date}}"
            fields:
              - { label: "Titre de l'article", name: "title", widget: "string" }
              - label: "Slug (identifiant dans l'URL)"
                name: "slug"
                widget: "string"
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Uniquement des lettres minuscules sans accent, des chiffres et des tirets (ex. : mes-derniers-projets)"]
                hint: "Adresse de l'article : denistossou.com/blog/<slug>/. Lettres minuscules, chiffres et tirets, sans espace, accent ni « / ». Ex. : mes-derniers-projets. Ne le change pas après publication (les liens déjà partagés casseraient)."
              - label: "Titre pour Google (optionnel)"
                name: "seoTitle"
                widget: "string"
                required: false
                hint: "Version courte du titre affichée dans les résultats Google (60 caractères maximum). Laisse vide pour reprendre le titre de l'article."
              - { label: "Date de publication", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Date de mise à jour (optionnel)", name: "updated", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, required: false, hint: "À remplir seulement si tu modifies un article de façon importante." }
              - label: "Image de couverture"
                name: "cover"
                widget: "image"
                hint: "Format JPG, 1200 × 630 px idéalement, moins de 300 Ko. Nom de fichier sans accent ni espace (ex. : blog-mon-sujet.jpg). C'est aussi l'image affichée quand l'article est partagé sur LinkedIn ou WhatsApp."
              - label: "Résumé (affiché sur la liste des articles)"
                name: "excerpt"
                widget: "text"
                hint: "Sert aussi de description dans Google : 140 à 160 caractères, avec le sujet principal de l'article."
              - label: "Contenu de l'article"
                name: "body"
                widget: "markdown"
                hint: "Le contenu complet de l'article. Commence directement par l'introduction (le titre est déjà affiché en haut de la page) et utilise « Heading 2 » et « Heading 3 » pour les intertitres."
